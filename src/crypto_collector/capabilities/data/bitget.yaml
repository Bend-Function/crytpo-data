schema_version: 1
exchange: bitget
anonymous_only: true
markets:
  - market: spot
    rest_base_urls:
      - https://api.bitget.com
    websocket_base_urls:
      - wss://ws.bitget.com/v3/ws/public
    live_book:
      channel: books
      supported_depths: [symbol_max_depth]
      recommended_depth: symbol_max_depth
      update_interval_ms: 50
      bootstrap: none
      max_rest_depth: 1000
    connection_limits:
      connection_attempts:
        limit: 300
        window_seconds: 300
        scope: ip
      concurrent_connections: 100
      client_messages_per_second: 10
      subscription_requests:
        limit: 240
        window_seconds: 3600
        scope: connection
      subscriptions_per_connection: 1000
      recommended_subscriptions_per_connection: 49
      connection_lifetime_seconds: 86400
  - market: perpetual
    rest_base_urls:
      - https://api.bitget.com
    websocket_base_urls:
      - wss://ws.bitget.com/v3/ws/public
    live_book:
      channel: books
      supported_depths: [symbol_max_depth]
      recommended_depth: symbol_max_depth
      update_interval_ms: 50
      bootstrap: none
      max_rest_depth: 1000
    connection_limits:
      connection_attempts:
        limit: 300
        window_seconds: 300
        scope: ip
      concurrent_connections: 100
      client_messages_per_second: 10
      subscription_requests:
        limit: 240
        window_seconds: 3600
        scope: connection
      subscriptions_per_connection: 1000
      recommended_subscriptions_per_connection: 49
      connection_lifetime_seconds: 86400
date_gated_features: []
