    withdrawal:
      required:
        - nonce
        - asset
        - key
        - amount
      type: object
      properties:
        nonce:
          $ref: '#/components/schemas/nonce'
        asset:
          description: Asset being withdrawn
          type: string
        aclass:
          description: Specify the asset class of the asset being withdrawn
          type: string
          enum:
            - currency
            - tokenized_asset
          default: currency
        key:
          description: Withdrawal key name, as set up on your account
          type: string
        address:
