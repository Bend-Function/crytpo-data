                    - currency
                    - tokenized_asset
                  default: currency
                amount:
                  type: string
                  description: Amount of asset to transfer
                from:
                  type: string
                  description: >-
                    Public account ID of the source account (Example ABCD 1234
                    EFGH 5678)
                to:
