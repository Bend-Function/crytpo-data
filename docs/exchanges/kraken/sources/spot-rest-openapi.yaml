openapi: 3.0.0
info:
  title: REST API
  version: 1.1.0
  description: ''
servers:
  - url: https://api.kraken.com/0
    description: Production Server
security:
  - API-Key: []
    API-Sign: []
tags:
  - name: Market Data
  - name: Account Data
  - name: Trading
  - name: Funding
  - name: Subaccounts
    description: >-
      Subaccounts are currently only available to institutional clients. Please
      contact your Account Manager for more details.
  - name: Earn
    description: >
      The earn API allows interacting with all of Kraken's yield generating
      products. It replaces the old `/staking` part of the API.


      The different available earn products are represented by earn strategies.
      This corresponds to the legacy `Staking/Assets`. `Stake`/`Unstake` are
      replaced by `Allocate`/`Deallocate`.


      ### Overview of the available endpoints under `/Earn`:


      - `Strategies` - list all earn strategies for which you are eligible or
      have a balance.

      - `Allocations` - lists the balance in your earn account for each
      strategy. Requires the `Query Funds` API key permission.

      - `Allocate`/`Deallocate` - allocate/deallocate to an earn strategy
      through an async operation. Requires the `Earn Funds` API key permission.

      - `AllocateStatus`/`DeallocateStatus` - verifies the state of the last
      allocation/deallocation. Requires the `Earn Funds` or `Query Funds` API
      key permission.


      ### Example usage:


      ### Determine which funds are earning rewards:


      1. Call `Strategies` to obtain information about the relevant strategy.
      The `lock_type` field shows whether bonding/unbonding funds are earning
      yield. The relevant fields are `bonding_rewards`/`unbonding_rewards`.

      2. Call `Allocations` for the relevant strategy. From the previous step,
      for strategies where bonding/unbonding does not earn yield, substract
      these balances from `amount_allocated.total` to determine which balances
      are currently earning.


      ### Get allocatable balance:


      Call `/0/private/BalanceEx`, subtract `hold_trading` amount. Remaining
      balance is available for allocation to a strategy.


      ### Geo restrictions:


      Some earn strategies are not available in all geographic regions.
      `Strategies` will return only strategies available to the caller.
  - name: Transparency
paths:
  /public/Time:
    get:
      tags:
        - Market Data
      summary: Get Server Time
      description: |
        Get the server's time.
      operationId: getServerTime
      security: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/time'
                example:
                  error: []
                  result:
                    unixtime: 1688669448
                    rfc1123: Thu, 06 Jul 23 18:50:48 +0000
  /public/SystemStatus:
    get:
      tags:
        - Market Data
      summary: Get System Status
      description: |
        Get the current system status or trading mode.
      operationId: getSystemStatus
      security: []
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    properties:
                      status:
                        type: string
                        enum:
                          - online
                          - maintenance
                          - cancel_only
                          - post_only
                        description: >
                          Current system status:

                          * `online`  Kraken is operating normally. All order
                          types may be submitted and trades can occur.

                          * `maintenance`  The exchange is offline. No new
                          orders or cancellations may be submitted.

                          * `cancel_only`  Resting (open) orders can be
                          cancelled but no new orders may be submitted. No
                          trades will occur.

                          * `post_only`  Only post-only limit orders can be
                          submitted. Existing orders may still be cancelled. No
                          trades will occur.
                      timestamp:
                        type: string
                        description: Current timestamp (RFC3339)
                  error:
                    $ref: '#/components/schemas/error'
                example:
                  error: []
                  result:
                    status: online
                    timestamp: '2023-07-06T18:52:00Z'
  /public/Assets:
    get:
      tags:
        - Market Data
      summary: Get Asset Info
      description: >
        Get information about the assets that are available for deposit,
        withdrawal, trading and earn.
      operationId: getAssetInfo
      security: []
      parameters:
        - $ref: '#/components/parameters/asset'
        - $ref: '#/components/parameters/aclass'
        - $ref: '#/components/parameters/assetVersion'
      responses:
        '200':
          description: Asset info retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/info-2'
                example:
                  error: []
                  result:
                    XXBT:
                      aclass: currency
                      altname: XBT
                      decimals: 10
                      display_decimals: 5
                      collateral_value: 1
                      status: enabled
                    ZEUR:
                      aclass: currency
                      altname: EUR
                      decimals: 4
                      display_decimals: 2
                      collateral_value: 1
                      status: enabled
                    ZUSD:
                      aclass: currency
                      altname: USD
                      decimals: 4
                      display_decimals: 2
                      collateral_value: 1
                      status: enabled
  /public/AssetPairs:
    get:
      tags:
        - Market Data
      summary: Get Tradable Asset Pairs
      description: |
        Get tradable asset pairs
      operationId: getTradableAssetPairs
      security: []
      parameters:
        - $ref: '#/components/parameters/assetVersion'
        - in: query
          name: pair
          description: Asset pairs to get data for
          schema:
            type: string
          example: BTC/USD,ETH/BTC
        - in: query
          name: aclass_base
          schema:
            type: string
            enum:
              - currency
              - tokenized_asset
            default: currency
          description: |
            Filters the asset class to retrieve (optional)

              * `currency` = spot currency pairs.
              * `tokenized_asset` = tokenized asset pairs, i.e. xstocks.
        - in: query
          name: info
          schema:
            type: string
            enum:
              - info
              - leverage
              - fees
              - margin
            default: info
          description: |
            Info to retrieve (optional)

              * `info` = all info
              * `leverage` = leverage info
              * `fees` = fees schedule
              * `margin` = margin info
        - in: query
          name: country_code
          description: >-
            Filter for response to only include pairs available in the provided
            country/region (ISO 3166-1 alpha-2 code).
          schema:
            type: string
          example: GB
        - in: query
          name: execution_venue
          schema:
            type: string
            enum:
              - international
              - bitnomial_exchange
            default: international
          description: |
            Comma-separated list of execution venues to filter by (optional)

