                - incompleteSide
          required:
            - reason
    RfqOfferPlacementResponse:
      oneOf:
        - $ref: '#/components/schemas/RfqOfferPlacementSuccessResponse'
        - $ref: '#/components/schemas/RfqOfferPlacementFailureResponse'
      discriminator:
        propertyName: status
        mapping:
          placed: '#/components/schemas/RfqOfferPlacementSuccessResponse'
          failed: '#/components/schemas/RfqOfferPlacementFailureResponse'
    RfqOfferCancellationSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
    RfqOfferCancellationFailureResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            reason:
              type: string
              enum:
                - rfqNotFound
                - offerNotFound
          required:
            - reason
    RfqOfferCancellationResponse:
      oneOf:
        - $ref: '#/components/schemas/RfqOfferCancellationSuccessResponse'
        - $ref: '#/components/schemas/RfqOfferCancellationFailureResponse'
      discriminator:
        propertyName: status
        mapping:
          cancelled: '#/components/schemas/RfqOfferCancellationSuccessResponse'
          failed: '#/components/schemas/RfqOfferCancellationFailureResponse'
    OpenRfqPrivateJson:
      type: object
      properties:
        uid:
          type: string
          format: uuid
          description: The unique identifier for this RFQ
        expiry:
          type: string
          format: date-time
          description: The time at which this RFQ expires
        markPrice:
          type: number
          format: double
          description: The reference price of the RFQ
        legs:
          type: array
          items:
            $ref: '#/components/schemas/OpenRfqPosition'
          description: The positions associated with the RFQ
        bestBid:
          type: number
          format: double
          description: The best bid price across all offers
        bestAsk:
          type: number
          format: double
          description: The best ask price across all offers
        bidSide:
          type: array
          items:
            $ref: '#/components/schemas/RfqLegOffer'
          description: >-
            Per-leg pricing of the offer that produced bestBid. Null when that
            offer was placed as a package total or when no bid offers exist.
        askSide:
          type: array
          items:
            $ref: '#/components/schemas/RfqLegOffer'
          description: >-
            Per-leg pricing of the offer that produced bestAsk. Null when that
