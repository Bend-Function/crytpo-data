          required:
            - rfqs
    OpenRfqResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            rfq:
              $ref: '#/components/schemas/OpenRfq'
          required:
            - rfq
    RfqLegOffer:
