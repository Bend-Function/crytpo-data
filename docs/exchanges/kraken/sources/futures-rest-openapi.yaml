  /options-mm-greek-limits:
    get:
      operationId: getOptionsMmGreekLimits
      tags:
        - Trading Settings
      summary: Get options MM greek limits
      description: >-
        Returns the per-currency delta and vega limits configured for this

        options market maker account, keyed by base currency (e.g. `BTC`,
        `ETH`).


        Only accessible to master accounts with the options market maker flag

        enabled. Subaccounts are not permitted.
      security:
        - general-api-key-read-only: []
          authent: []
      responses:
        '200':
          description: Current options MM greek limits
          content:
            application/json:
              schema:
                oneOf:
                  - title: Success Response
                    allOf:
                      - $ref: '#/components/schemas/OptionsMmGreekLimitsJson'
                      - $ref: '#/components/schemas/SuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is not an options market maker, or is a subaccount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-internalOnly: true
    put:
      operationId: setOptionsMmGreekLimits
      tags:
        - Trading Settings
      summary: Update options MM greek limits for a currency
      description: |-
        Sets the delta and/or vega limit for a single base currency on this
        options market maker account.

        Only accessible to master accounts with the options market maker flag
        enabled. Subaccounts are not permitted.

        `currency` is required. Each call replaces the row for that currency:
        any greek that is omitted, blank, or zero is stored as no-limit. Use
        the DELETE method to remove a currency entry entirely (or all entries).
      security:
        - general-api-key: []
          authent: []
      parameters:
        - description: Base currency the limits apply to (e.g. `BTC`, `ETH`).
          name: currency
          in: query
          required: true
          schema:
            type: string
        - description: |-
            Maximum allowed net delta exposure in this currency.
            Must be a non-negative number.
          name: deltaLimit
          in: query
          required: false
          schema:
            type: string
        - description: |-
            Maximum allowed net vega exposure in this currency.
            Must be a non-negative number.
          name: vegaLimit
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Options MM greek limits were successfully updated
          content:
            application/json:
              schema:
                oneOf:
                  - title: Success Response
                    allOf:
                      - $ref: '#/components/schemas/OptionsMmGreekLimitsJson'
                      - $ref: '#/components/schemas/SuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: |-
            A parameter is invalid: missing currency, unknown currency, or a
            non-numeric / negative limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is not an options market maker, or is a subaccount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-internalOnly: true
    delete:
      operationId: deleteOptionsMmGreekLimits
      tags:
        - Trading Settings
      summary: Delete options MM greek limits
      description: |-
        Deletes options MM greek limits. If `currency` is provided, only
        that currency's entry is removed. Otherwise, all per-currency entries
        for the account are removed.

        Only accessible to master accounts with the options market maker flag
        enabled. Subaccounts are not permitted.
      security:
        - general-api-key: []
          authent: []
      parameters:
        - description: |-
            Optional base currency to clear. If omitted, all currencies are
            cleared.
          name: currency
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Options MM greek limits were successfully deleted
          content:
            application/json:
              schema:
                oneOf:
                  - title: Success Response
                    allOf:
                      - $ref: '#/components/schemas/OptionsMmGreekLimitsJson'
                      - $ref: '#/components/schemas/SuccessResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is not an options market maker, or is a subaccount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-internalOnly: true
