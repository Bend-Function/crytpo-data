    OrderBook:
      type: object
      properties:
        asks:
          description: >-
            The first value of the inner list is the ask price, the second is
            the ask size. The outer list is sorted ascending by ask price.
          type: array
          items:
            description: >-
              An array of two floats. The first value is the price. The second
              value is the size.
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
            example:
              - 40178
              - 5
        bids:
          description: >-
            The first value of the inner list is the bid price, the second is
            the bid size. The outer list is sorted descending by bid price.
          type: array
          items:
            description: >-
              An array of two floats. The first value is the price. The second
              value is the size.
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
            example:
              - 40178
              - 5
      required:
        - asks
        - bids
      example:
        bids:
          - - 40178
            - 5
          - - 40174
            - 4.2
          - - 40170
            - 7.2
        asks:
          - - 40186
            - 5.0183
          - - 40190
            - 0.4183
    OrderDirection:
