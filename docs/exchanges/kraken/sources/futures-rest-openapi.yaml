              type: string
              format: uuid
        - description: Client Order IDs associated with orders or triggers.
          name: cliOrdIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          example:
            - testOrder1
            - testOrder2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  - title: Success Response
                    allOf:
                      - type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: '#/components/schemas/OrderStatusDetailsJson'
                        required:
