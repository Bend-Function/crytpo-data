  /rfqs/{rfqUid}:
    get:
      operationId: getRfq
      tags:
        - RFQs
      summary: Retrieve a single RFQ (open or recently closed)
      description: >-
        Retrieve a specific RFQ by its unique identifier. Returns currently open
        RFQs as well as

        recently closed RFQs that are still held in the in-memory closed-RFQ
        cache. The `status`

        field on the response distinguishes the lifecycle state (`open`,
        `expired`, `cancelled`,

        `filled_bid_side`, or `filled_ask_side`).


        Closed RFQs are kept in memory only and are not persisted; entries may
        be evicted by the

        cache eviction policy or wiped on service restart.


        Note: This is currently available exclusively in the Kraken pre-prod
        environments.
      parameters:
        - description: Unique identifier for the RFQ
          name: rfqUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A single open RFQ
          content:
