                - fixedLeverageTooHigh
                - orderError
                - noBidOrAskProvided
                - marketRestricted
                - priceTooFarFromMarket
                - deltaLimitExceeded
                - vegaLimitExceeded
                - legMismatch
                - perLegAndPackagePricesProvided
