                - wouldCauseLiquidation
                - fixedLeverageTooHigh
                - orderError
                - symbolNotFound
                - invalidExpiry
                - invalidQuantity
                - marketRestricted
                - noLegsSpecified
                - accountNotFound
                - mixedCurrencyPairs
                - tooManyNonOptionLegs
                - noOptionLegs
                - tooManyOpenRfqs
                - tooManyLegs
                - expiryTooShort
          required:
            - reason
    RfqCreationResponse:
      oneOf:
        - $ref: '#/components/schemas/RfqCreationSuccessResponse'
        - $ref: '#/components/schemas/RfqCreationFailureResponse'
      discriminator:
        propertyName: status
        mapping:
          placed: '#/components/schemas/RfqCreationSuccessResponse'
          failed: '#/components/schemas/RfqCreationFailureResponse'
    RfqCancellationSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            rfqUid:
              type: string
              format: uuid
          required:
            - rfqUid
    RfqCancellationFailureResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            reason:
              type: string
              enum:
                - rfqNotFound
          required:
            - reason
    RfqCancellationResponse:
      oneOf:
        - $ref: '#/components/schemas/RfqCancellationSuccessResponse'
        - $ref: '#/components/schemas/RfqCancellationFailureResponse'
      discriminator:
        propertyName: status
        mapping:
          cancelled: '#/components/schemas/RfqCancellationSuccessResponse'
          failed: '#/components/schemas/RfqCancellationFailureResponse'
    RfqOfferAcceptanceSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            rfqUid:
              type: string
              format: uuid
          required:
            - rfqUid
    RfqOfferAcceptanceFailureResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            reason:
              type: string
              enum:
                - rfqNotFound
                - offerNotFound
                - noBidOrAskProvided
                - bidAndAskProvided
                - offerNoLongerValid
                - insufficientMargin
                - wouldCauseLiquidation
                - maxPositionExceeded
                - fixedLeverageTooHigh
                - orderError
                - priceTooFarFromMarket
                - marketRestricted
          required:
            - reason
    RfqOfferAcceptanceResponse:
      oneOf:
        - $ref: '#/components/schemas/RfqOfferAcceptanceSuccessResponse'
        - $ref: '#/components/schemas/RfqOfferAcceptanceFailureResponse'
      discriminator:
        propertyName: status
        mapping:
          placed: '#/components/schemas/RfqOfferAcceptanceSuccessResponse'
          failed: '#/components/schemas/RfqOfferAcceptanceFailureResponse'
  parameters:
    AlgoId:
      description: ID of the algorithm that is making the request.
      name: algoId
      in: header
      required: false
      schema:
        type: string
      x-cfOnly: true
    OrderSideQuery:
      description: The direction of the order.
      name: side
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/OrderDirection'
    OrderTypeQuery:
      description: |-
        The order type:

        - `lmt` - a limit order
        - `post` - a post-only limit order
        - `mkt` - an immediate-or-cancel order with 1% price protection
        - `stp` - a stop order
        - `take_profit` - a take profit order
        - `ioc` - an immediate-or-cancel order
        - `trailing_stop` - a trailing stop order
        - `fok` - fill or kill order
      name: orderType
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/OrderType'
    ProcessBefore:
      description: >-
        The time before which the request should be processed, otherwise it is
        rejected.
      name: processBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
      example: '2023-11-08T19:56:35.441899Z'
    ContractTypesQuery:
      description: >-
        Contract type(s) to return statuses for.


        By default, includes all futures instrument types.


        Multi-value example:
        `?contractType=futures_inverse&contractType=futures_vanilla`
      name: contractType
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - futures_inverse
            - futures_vanilla
            - flexible_futures
            - options
            - all
    ExpiredQuery:
      description: >-
        If `true`, return only expired instruments


        Defaults to `false`, in which case only non-expired instruments are
        returned
      name: expired
      in: query
      required: false
      schema:
        type: boolean
        default: false
    MarketSymbolPath:
      description: Market symbol.
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MarketSymbol'
    SymbolsQuery:
      description: >-
        Market symbol(s) to filter tickers by.


        Symbols are case-insensitive. Multi-value example:
        `?symbol=PF_BTCUSD&symbol=pf_ethusd`
      name: symbol
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/MarketSymbol'
    MarketSymbolQueryRequired:
      description: Market symbol.
      name: symbol
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/MarketSymbol'
