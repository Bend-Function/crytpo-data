        status:
          type: string
          enum:
            - open
            - expired
            - cancelled
            - filled_bid_side
            - filled_ask_side
          description: >-
            Lifecycle status of the RFQ. Always `open` for entries returned from
            this endpoint.
      required:
        - uid
        - expiry
        - markPrice
        - legs
        - status
    OpenRfqsForAccountResponse:
      allOf:
        - $ref: '#/components/schemas/ResponseJson'
        - type: object
          properties:
            rfqs:
              type: array
              items:
                $ref: '#/components/schemas/OpenRfqPrivateJson'
          required:
            - rfqs
    RfqLeg:
      type: object
      required:
        - tradeable
        - size
      properties:
        tradeable:
          type: string
          description: The symbol of the derivatives contract
        size:
          type: number
          format: double
          description: The size of the leg
    RfqCreationRequest:
